spring:
  application:
    name: letmecook
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:56422/postgres}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      auto-commit: false
      pool-name: HikariPoolLetMeCook
      idle-timeout: 60000
      max-lifetime: 300000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

server:
  port: ${SERVER_PORT:9402}
  address: ${SERVER_ADDRESS:127.0.0.1}
  error:
    include-message: always

supabase:
  url: ${SUPABASE_URL:http://127.0.0.1:56421}
  jwt:
    # Leave secret empty for asymmetric signing keys; never send this to the browser.
    secret: ${SUPABASE_JWT_SECRET:}
    issuer: ${SUPABASE_JWT_ISSUER:${supabase.url}/auth/v1}
    jwk-set-uri: ${SUPABASE_JWKS_URL:${supabase.url}/auth/v1/.well-known/jwks.json}
    audience: ${SUPABASE_JWT_AUDIENCE:authenticated}

app:
  cors-origins: ${CORS_ORIGINS:${CORS_ALLOWED_ORIGINS:http://localhost:9401,http://127.0.0.1:9401,http://localhost:5173,http://127.0.0.1:5173}}
local-ai:
  url: ${LOCAL_AI_URL:http://127.0.0.1:9501}
recommendation:
  url: ${RECOMMENDATION_URL:http://127.0.0.1:9501}
