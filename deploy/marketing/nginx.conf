server {
    listen 127.0.0.1:8092;
    server_name letmecook.ca www.letmecook.ca;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; form-action 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /_healthz {
        default_type text/plain;
        return 200 "LetMeCook marketing origin ready\n";
    }

    location ~ (^|/)\. {
        return 404;
    }

    # A public marketing origin has no application or backend proxy.
    location ~ ^/(api|auth|rest|storage|functions|recipes|sunny|meal-planner|pantry|household|login|register|profile|dashboard|admin|operations)(/|$) {
        return 404;
    }

    location / {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        try_files $uri/index.html $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
