# Dedicated origin for the already running LetMeCook application.
# Cloudflare's existing connector reaches only this loopback listener.
map $uri $lmc_domain_private_robots {
    default "";
    ~^/(api|auth|rest|storage|supabase)(/|$) "noindex, nofollow";
    ~^/(sunny|search|meal-planner|newsletter|login|register|forgot-password|reset-password|dashboard|profile|edit-profile|favourites|user-recipe|create-recipe|edit-recipe|pantry|household|cook-along|evidence|creator|admin|unauthorized|forbidden)(/|$) "noindex, nofollow";
}

map $http_upgrade $lmc_domain_connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 127.0.0.1:8092 default_server;
    server_name _;
    server_tokens off;
    return 400;
}

server {
    listen 127.0.0.1:8092;
    server_name www.letmecook.ca;
    server_tokens off;
    return 301 https://letmecook.ca$request_uri;
}

server {
    listen 127.0.0.1:8092;
    server_name letmecook.ca;
    server_tokens off;
    client_max_body_size 20m;

    # The connector is local; no other network source is trusted for this header.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    add_header X-Robots-Tag $lmc_domain_private_robots always;

    location / {
        proxy_pass http://127.0.0.1:9401;
        proxy_http_version 1.1;
        proxy_set_header Host letmecook.ca;
        proxy_set_header X-Forwarded-Host letmecook.ca;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $lmc_domain_connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_intercept_errors off;
        proxy_redirect off;
        proxy_cache off;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Permissions-Policy;
    }
}
