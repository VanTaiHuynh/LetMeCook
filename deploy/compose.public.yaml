# Keep the local deployment and credentials file; layer this public domain configuration on top.
services:
  backend:
    environment:
      CORS_ORIGINS: http://localhost:9401,http://127.0.0.1:9401,https://letmecook.ca,https://www.letmecook.ca
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      PLATFORM_BASE_URL: https://letmecook.ca
  web:
    build:
      args:
        VITE_PUBLIC_SITE_ORIGIN: https://letmecook.ca
        VITE_SEO_INDEXING_ENABLED: "false"
    environment:
      PUBLIC_SITE_ORIGIN: https://letmecook.ca
      SEO_INDEXING_ENABLED: "false"
