worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  # Requests reach this listener only over loopback, directly or through the dedicated tunnel origin.
  map $http_x_forwarded_proto $lmc_forwarded_proto { default $scheme; https https; http http; }
  include /tmp/lmc-seo-headers.conf;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server {
    listen 127.0.0.1:9401;
    server_name www.letmecook.ca;
    return 301 https://letmecook.ca$request_uri;
  }
  server {
    listen 127.0.0.1:9401 default_server;
    server_name localhost letmecook.ca;
    root /usr/share/nginx/html;
    client_max_body_size 20m;
    location /api/ {
      add_header X-Robots-Tag "noindex" always;
      proxy_pass http://127.0.0.1:9402;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $lmc_forwarded_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Forwarded "";
      proxy_read_timeout 180s;
    }
    # Publish only the browser API routes; Supabase Studio, mail capture and DB stay private.
    location ~ ^/auth/v1/(?:admin|invite|generate_link)(?:/|$) { return 404; }
    location ~ ^/(?:auth|rest|storage)/v1/ {
      add_header X-Robots-Tag "noindex" always;
      add_header Cache-Control "no-store" always;
      proxy_pass http://127.0.0.1:56421;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $lmc_forwarded_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Forwarded "";
      proxy_read_timeout 60s;
    }
    location = /__recipe_image_access {
      internal;
      proxy_pass http://127.0.0.1:9402/api/platform/image-access;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-URI $request_uri;
    }
    location ~ "^/recipe-images/(?<lmc_recipe_image_file>[0-9a-fA-F-]{36}\.(?:jpg|jpeg|png|webp|gif))$" {
      if ($request_method !~ ^(?:GET|HEAD)$) { return 405; }
      auth_request /__recipe_image_access;
      proxy_pass http://127.0.0.1:56421/storage/v1/object/authenticated/recipe-images/$lmc_recipe_image_file;
      proxy_pass_request_body off;
      proxy_pass_request_headers off;
      proxy_set_header Host 127.0.0.1:56421;
      proxy_set_header Content-Length "";
      include /tmp/lmc-recipe-storage-auth.conf;
      proxy_hide_header Cache-Control;
      proxy_hide_header Set-Cookie;
      add_header Cache-Control "no-store" always;
      add_header X-Robots-Tag "noindex" always;
      proxy_read_timeout 60s;
    }
    location /recipe-images/ { return 404; }
    location = / { proxy_pass http://127.0.0.1:9403; proxy_read_timeout 20s; }
    location = /index.html { return 301 /; }
    location = /robots.txt { proxy_pass http://127.0.0.1:9403; }
    location = /sitemap.xml { proxy_pass http://127.0.0.1:9403; proxy_read_timeout 20s; }
    location /sitemaps/ { proxy_pass http://127.0.0.1:9403; proxy_read_timeout 20s; }
    location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; include /tmp/lmc-seo-headers.conf; }
    location / { try_files $uri @seo; }
    location @seo { proxy_pass http://127.0.0.1:9403; proxy_read_timeout 20s; }
  }
}
